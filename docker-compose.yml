services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: metro
      POSTGRES_DB: metro_buddy
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro"]
      interval: 2s
      retries: 15
  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

volumes:
  pgdata:
